name: astrbot_plugin_context_launcher
display_name: 上下文管家
short_desc: 看清每一轮请求有没有命中前缀缓存，没命中是被谁改的
desc: >
  在 on_llm_request 最低优先级（-20）拿到装配完成的请求，比对系统提示、工具定义和每条历史的指纹，
  判断这一轮是「只追加」还是「前缀被改写」，再用 provider 返回的真实 usage 算命中率。
  默认只观测，一个字节都不改；两种确定性压缩需要手动打开。
  自带 WebUI / 桌面 Launcher 面板：命中率、每次未命中 token、断点归因、命中率走势。
  不注册 LLM 工具，不联网，只写自己的数据目录。
version: 2.0.0
author: fengrh520
repo: "https://github.com/fengrh520/astrbot-plugin-context-launcher"
astrbot_version: ">=4.16,<5"
support_platforms: [aiocqhttp, qq_official]
tags: [context, cache, token, cost, observability, dashboard]
